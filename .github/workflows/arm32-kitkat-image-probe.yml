name: Temporary ARM32 KitKat image probe

on:
  push:
    branches:
      - poc/arm32-kitkat-image-check

permissions:
  contents: read

jobs:
  inspect-and-boot:
    name: Inspect official API 19 ARM image and test boot
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Set up Java 17 for current Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@v4

      - name: Install emulator and platform tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "emulator" "platform-tools" "cmdline-tools;latest"

      - name: Download and inspect the official KitKat ARM32 system image
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://dl.google.com/android/repository/sys-img/google_apis/armeabi-v7a-19_r40.zip"
          ZIP="$RUNNER_TEMP/armeabi-v7a-19_r40.zip"
          DEST="$ANDROID_HOME/system-images/android-19/google_apis/armeabi-v7a"
          mkdir -p "$DEST" "$RUNNER_TEMP/arm32-image-probe"
          curl --fail --location --retry 3 --retry-all-errors "$URL" --output "$ZIP"
          echo "Downloaded package:"
          ls -lh "$ZIP"
          sha256sum "$ZIP" | tee "$GITHUB_WORKSPACE/arm32-image-report.txt"
          echo >> "$GITHUB_WORKSPACE/arm32-image-report.txt"
          echo "=== ZIP CONTENTS ===" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          unzip -l "$ZIP" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          unzip -oq "$ZIP" -d "$DEST"
          echo "=== EXTRACTED FILES ===" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          find "$DEST" -maxdepth 3 -type f -printf '%P (%s bytes)\n' | sort | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          echo "=== SOURCE PROPERTIES ===" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          if test -f "$DEST/source.properties"; then
            cat "$DEST/source.properties" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          else
            echo "No source.properties at package root" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          fi
          echo "=== KERNEL CANDIDATES ===" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          find "$DEST" -maxdepth 3 -type f \( -iname 'kernel*' -o -iname '*ramdisk*' -o -iname 'system.img' \) -print | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo "--- $f" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
            file "$f" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
            if [[ "$(basename "$f")" == kernel* ]]; then
              strings "$f" | grep -m 8 -E 'Linux version|goldfish|Android' | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt" || true
            fi
          done < <(find "$DEST" -maxdepth 3 -type f \( -iname 'kernel*' -o -iname '*ramdisk*' -o -iname 'system.img' \))
          test -s "$DEST/system.img"
          echo "IMAGE_INSPECTION_OK=true" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"

      - name: Create ARM32 KitKat AVD
        shell: bash
        run: |
          set -euxo pipefail
          echo no | avdmanager create avd \
            --name kitkat-arm32-poc \
            --package "system-images;android-19;google_apis;armeabi-v7a" \
            --force
          cat "$HOME/.android/avd/kitkat-arm32-poc.avd/config.ini" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          "$ANDROID_HOME/emulator/emulator" -version | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          find "$ANDROID_HOME/emulator" -maxdepth 2 -type f \( -name 'emulator-arm' -o -name 'emulator64-arm' -o -name 'emulator' \) -print | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"

      - name: Attempt a software-only KitKat boot
        shell: bash
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/kitkat-arm32-emulator.log"
          "$ANDROID_HOME/emulator/emulator" \
            -avd kitkat-arm32-poc \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel off -gpu off -verbose > "$LOG" 2>&1 &
          EMU_PID=$!
          BOOT_OK=false
          for i in $(seq 1 240); do
            if adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              BOOT_OK=true
              break
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator process exited before Android completed boot."
              break
            fi
            sleep 1
          done
          echo "=== BOOT TEST ===" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          echo "BOOT_OK=$BOOT_OK" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
          adb devices -l | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt" || true
          tail -n 180 "$LOG" | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt" || true
          if [ "$BOOT_OK" = true ]; then
            adb -e shell getprop ro.build.version.release | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
            adb -e shell getprop ro.product.cpu.abi | tee -a "$GITHUB_WORKSPACE/arm32-image-report.txt"
            adb -e shell screencap -p /sdcard/kitkat-poc.png || true
            adb -e pull /sdcard/kitkat-poc.png "$GITHUB_WORKSPACE/kitkat-arm32-poc.png" || true
          fi
          kill "$EMU_PID" 2>/dev/null || true
          wait "$EMU_PID" 2>/dev/null || true
          if [ "$BOOT_OK" != true ]; then
            exit 1
          fi

      - name: Upload diagnostic report and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm32-kitkat-probe-report
          path: |
            arm32-image-report.txt
            kitkat-arm32-emulator.log
            kitkat-arm32-poc.png
          if-no-files-found: warn
          retention-days: 7
