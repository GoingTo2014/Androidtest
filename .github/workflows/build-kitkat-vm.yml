name: Build KitKat VM (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitkat-vm-build
  cancel-in-progress: false

jobs:
  build:
    name: Build QEMU-backed Android VM APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out Androidtest
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-29' \
            'build-tools;29.0.3' \
            'ndk;23.1.7779620'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential curl flex gettext git \
            libtool-bin make patch pkg-config python3 rsync texinfo wget xz-utils

      - name: Check out pinned Limbo source
        run: |
          git clone https://github.com/limboemu/limbo.git "$RUNNER_TEMP/limbo"
          cd "$RUNNER_TEMP/limbo"
          git checkout 887c6a68cd6b414377d7f8071bc12bbc16e59809

      - name: Download and patch QEMU dependencies
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL https://download.qemu.org/qemu-5.1.0.tar.xz -o /tmp/qemu.tar.xz
          tar -xJf /tmp/qemu.tar.xz
          mv qemu-5.1.0 qemu

          curl -fL https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-2.56.1.tar.xz -o /tmp/glib.tar.xz
          tar -xJf /tmp/glib.tar.xz
          mv glib-2.56.1 glib

          curl -fL https://sourceware.org/pub/libffi/libffi-3.3.tar.gz -o /tmp/libffi.tar.gz
          tar -xzf /tmp/libffi.tar.gz
          mv libffi-3.3 libffi

          curl -fL https://www.cairographics.org/releases/pixman-0.40.0.tar.gz -o /tmp/pixman.tar.gz
          tar -xzf /tmp/pixman.tar.gz
          mv pixman-0.40.0 pixman

          curl -fL https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -o /tmp/sdl2.tar.gz
          tar -xzf /tmp/sdl2.tar.gz
          mv SDL2-2.0.8 SDL2

          patch -d qemu -p1 < patches/qemu-5.1.0.patch
          patch -d glib -p1 < patches/glib-2.56.1.patch
          patch -d SDL2 -p1 < patches/sdl2-2.0.8.patch

      - name: Apply Android 14 and no-root adjustments
        working-directory: ${{ runner.temp }}/limbo
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY='limbo-android-x86/src/main/java/com/limbo/emu/main/LimboEmuActivity.java'
          CONFIG='limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/Config.java'
          MANIFEST='limbo-android-x86/src/main/AndroidManifest.xml'
          GRADLE='limbo-android-x86/build.gradle'

          # The native QEMU build also disables KVM. Force the app UI/runtime off it.
          sed -i 's/Config.enableKVM = true;/Config.enableKVM = false;/' "$ACTIVITY"

          # Keep logs in the app-private directory instead of a legacy root-level path.
          sed -i 's|Logger.setupLogFile("/limbo/limbo-x86-log.txt");|Logger.setupLogFile(getFilesDir().getAbsolutePath() + "/limbo-x86-log.txt");|' "$ACTIVITY"

          # Give the app a distinct name, cap vCPUs to avoid accidental over-allocation,
          # and package only the ARM64 host library to reduce APK size.
          sed -i 's/public static final String APP_NAME = "Limbo Emulator";/public static final String APP_NAME = "KitKat VM (Preview)";/' "$CONFIG"
          sed -i 's/public static final int MAX_CPU_NUM = 8;/public static final int MAX_CPU_NUM = 4;/' "$CONFIG"
          sed -i 's/android:label="Limbo x86 PC Emulator"/android:label="KitKat VM (Preview)" android:requestLegacyExternalStorage="true"/' "$MANIFEST"
          sed -i 's/abiFilters "armeabi-v7a","arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' "$GRADLE"
          sed -i 's/applicationId "com.limbo.emu.main"/applicationId "com.goingto2014.androidtest.kitkatvm"/' "$GRADLE"

          grep -q 'Config.enableKVM = false;' "$ACTIVITY"
          grep -q 'getFilesDir().getAbsolutePath() + "/limbo-x86-log.txt"' "$ACTIVITY"
          grep -q 'MAX_CPU_NUM = 4' "$CONFIG"
          grep -q 'abiFilters "arm64-v8a"' "$GRADLE"
          grep -q 'applicationId "com.goingto2014.androidtest.kitkatvm"' "$GRADLE"
          
          # Add an in-app download entry for the official Android-x86 KitKat ISO.
          # The URL is the project's SourceForge file endpoint and may redirect to a mirror.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("limbo-android-x86/src/main/java/com/limbo/emu/main/LimboEmuActivity.java")
          source = path.read_text()
          if "MENU_DOWNLOAD_KITKAT_ISO" not in source:
              marker = "import android.os.Bundle;\n"
              imports = """import android.Manifest;
          import android.app.DownloadManager;
          import android.content.DialogInterface;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.widget.Toast;
          import androidx.appcompat.app.AlertDialog;
          """
              if marker not in source:
                  raise SystemExit("Could not find Java import anchor for ISO downloader")
              source = source.replace(marker, marker + imports, 1)

              class_marker = "public class LimboEmuActivity extends LimboActivity {\n"
              methods = """
              private static final int MENU_DOWNLOAD_KITKAT_ISO = 0x4B49534F;
              private static final int REQUEST_KITKAT_ISO_STORAGE = 4144;
              private static final String KITKAT_ISO_FILE = "android-x86-4.4-r4.iso";
              private static final String KITKAT_ISO_URL = "https://sourceforge.net/projects/android-x86/files/Release%204.4/android-x86-4.4-r4.iso/download";
              private static final String KITKAT_RELEASE_NOTES_URL = "https://www.android-x86.org/releases/releasenote-4-4-r4.html";
              private static final String KITKAT_ISO_SHA1 = "2a33c508a632dd228928816a30fe44eff0da4728";

              @Override
              public boolean onPrepareOptionsMenu(Menu menu) {
                  boolean result = super.onPrepareOptionsMenu(menu);
                  menu.add(0, MENU_DOWNLOAD_KITKAT_ISO, 100, "Download KitKat ISO")
                          .setShowAsAction(MenuItem.SHOW_AS_ACTION_NEVER);
                  return result;
              }

              @Override
              public boolean onOptionsItemSelected(MenuItem item) {
                  if (item.getItemId() == MENU_DOWNLOAD_KITKAT_ISO) {
                      promptKitKatIsoDownload();
                      return true;
                  }
                  return super.onOptionsItemSelected(item);
              }

              private void promptKitKatIsoDownload() {
                  String message = "Downloads the official Android-x86 4.4-r4 ISO (about 451 MB)."
                          + "\\n\\nDownload request URL:\\n" + KITKAT_ISO_URL
                          + "\\n\\nOfficial release notes:\\n" + KITKAT_RELEASE_NOTES_URL
                          + "\\n\\nSHA-1 published by the release notes:\\n" + KITKAT_ISO_SHA1
                          + "\\n\\nSourceForge may redirect this request to one of its mirrors. "
                          + "The ISO will be saved as Downloads/" + KITKAT_ISO_FILE
                          + ". Mobile data charges may apply.";
                  new AlertDialog.Builder(this)
                          .setTitle("Download Android 4.4 KitKat ISO")
                          .setMessage(message)
                          .setPositiveButton("Download", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface dialog, int which) {
                                  requestKitKatIsoStoragePermission();
                              }
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void requestKitKatIsoStoragePermission() {
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE},
                              REQUEST_KITKAT_ISO_STORAGE);
                      return;
                  }
                  enqueueKitKatIsoDownload();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQUEST_KITKAT_ISO_STORAGE) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          enqueueKitKatIsoDownload();
                      } else {
                          Toast.makeText(this, "Storage permission is required to save the ISO in Downloads.",
                                  Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private void enqueueKitKatIsoDownload() {
                  DownloadManager manager = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                  if (manager == null) {
                      Toast.makeText(this, "Android Download Manager is unavailable.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  try {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(KITKAT_ISO_URL));
                      request.setTitle(KITKAT_ISO_FILE);
                      request.setDescription("Official Android-x86 4.4-r4 ISO from the Android-x86 project on SourceForge");
                      request.setMimeType("application/octet-stream");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverRoaming(false);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, KITKAT_ISO_FILE);
                      long id = manager.enqueue(request);
                      Toast.makeText(this, "ISO download queued. Follow progress in Android notifications.\nDownload ID: " + id,
                              Toast.LENGTH_LONG).show();
                  } catch (SecurityException e) {
                      Toast.makeText(this, "Android denied access to Downloads. Grant storage access and try again.",
                              Toast.LENGTH_LONG).show();
                  } catch (IllegalArgumentException e) {
                      Toast.makeText(this, "Could not start the ISO download: " + e.getMessage(),
                              Toast.LENGTH_LONG).show();
                  }
              }

              """
              if class_marker not in source:
                  raise SystemExit("Could not find Java class anchor for ISO downloader")
              source = source.replace(class_marker, class_marker + methods, 1)
          path.write_text(source)
          PY

          grep -q 'MENU_DOWNLOAD_KITKAT_ISO' "$ACTIVITY"
          grep -q 'sourceforge.net/projects/android-x86/files/Release%204.4/android-x86-4.4-r4.iso/download' "$ACTIVITY"
          grep -q 'setDestinationInExternalPublicDir' "$ACTIVITY"
          grep -q 'android:requestLegacyExternalStorage="true"' "$MANIFEST"


      - name: Build optimized ARM64 QEMU native libraries (KVM disabled)
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        shell: bash
        run: |
          set -euxo pipefail
          NDK_ROOT="$ANDROID_HOME/ndk/23.1.7779620"
          export NDK_MODULE_PATH="$NDK_ROOT/sources/"
          make limbo \
            NDK_ROOT="$NDK_ROOT" \
            NDK_ENV=linux-x86_64 \
            BUILD_HOST=arm64-v8a \
            BUILD_GUEST=x86_64-softmmu \
            USE_QEMU_VERSION=5.1.0 \
            USE_GCC=false \
            USE_KVM=false \
            USE_AAUDIO=false \
            USE_OPTIMIZATION=true \
            BUILD_THREADS=2

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/limbo
        run: gradle --no-daemon :limbo-android-x86:assembleDebug

      - name: Verify APK output
        working-directory: ${{ runner.temp }}/limbo
        run: |
          APK='limbo-android-x86/build/outputs/apk/debug/limbo-android-x86-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libqemu-system-x86_64.so|AndroidManifest.xml'

      - name: Upload KitKat VM APK
        uses: actions/upload-artifact@v4
        with:
          name: kitkat-vm-arm64-debug-apk
          path: ${{ runner.temp }}/limbo/limbo-android-x86/build/outputs/apk/debug/limbo-android-x86-debug.apk
          if-no-files-found: error
          retention-days: 14
